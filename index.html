<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Herramientas</title>
  <meta name="description" content="Panel privado de herramientas." />

  <style>
    :root{
      --bg1:#07111f;
      --bg2:#0b1b33;
      --panel:rgba(255,255,255,.075);
      --panelLine:rgba(255,255,255,.13);
      --btn1:#eaf8fb;
      --btn2:#d8edf3;
      --btnBorder:#a9d2dd;
      --btnText:#07586e;
      --btnText2:#063f55;
      --shadow:0 10px 24px rgba(0,0,0,.28);
      --glow:0 0 0 1px rgba(255,255,255,.10), 0 12px 28px rgba(0,0,0,.25);
      --radius:22px;
    }

    *{box-sizing:border-box}

    html,body{
      min-height:100%;
      margin:0;
    }

    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:#fff;
      background:
        radial-gradient(800px 500px at 12% -10%, rgba(0,191,255,.18), transparent 60%),
        radial-gradient(900px 520px at 100% 0%, rgba(34,197,94,.15), transparent 60%),
        radial-gradient(850px 560px at 50% 110%, rgba(124,58,237,.18), transparent 60%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), transparent 85%);
    }

    .wrap{
      width:min(1040px,94vw);
      margin:0 auto;
      padding:18px 0 28px;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      padding:10px 0 14px;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .hero{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px;
      border:1px solid var(--panelLine);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.105),rgba(255,255,255,.055));
      box-shadow:var(--glow);
    }

    h1{
      margin:0;
      font-size:clamp(22px,4.6vw,34px);
      line-height:1.05;
      letter-spacing:.2px;
      white-space:nowrap;
    }

    .search{
      width:min(420px,100%);
      display:flex;
      align-items:center;
      gap:8px;
      padding:0 13px;
      min-height:46px;
      border-radius:17px;
      background:rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.13);
    }

    .search span{
      opacity:.9;
    }

    .search input{
      width:100%;
      border:0;
      outline:0;
      color:#fff;
      background:transparent;
      font-size:15px;
      font-weight:600;
    }

    .search input::placeholder{
      color:rgba(255,255,255,.62);
      font-weight:500;
    }

    main{
      display:grid;
      gap:14px;
      margin-top:4px;
    }

    .section{
      padding:13px;
      border:1px solid var(--panelLine);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.045));
      box-shadow:var(--shadow);
    }

    .sectionHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      padding:0 3px;
    }

    .sectionTitle{
      margin:0;
      font-size:15px;
      line-height:1.2;
      letter-spacing:.2px;
      color:rgba(255,255,255,.90);
    }

    .count{
      flex:0 0 auto;
      padding:5px 9px;
      border-radius:999px;
      color:rgba(255,255,255,.82);
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.11);
      font-size:12px;
      font-weight:800;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }

    .toolBtn{
      height:58px;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:8px 14px;
      border-radius:17px;
      border:1px solid var(--btnBorder);
      background:
        linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.18) 42%,rgba(255,255,255,0) 43%),
        linear-gradient(180deg,var(--btn1),var(--btn2));
      color:var(--btnText);
      text-decoration:none;
      font-size:15px;
      font-weight:900;
      line-height:1.15;
      letter-spacing:.1px;
      box-shadow:0 8px 18px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.75);
      transition:transform .16s ease, filter .16s ease, box-shadow .16s ease, border-color .16s ease;
      overflow:hidden;
    }

    .toolBtn:hover{
      transform:translateY(-2px);
      filter:saturate(1.08) brightness(1.02);
      border-color:#81c2d2;
      box-shadow:0 13px 24px rgba(0,0,0,.26), 0 0 0 3px rgba(74,222,255,.10), inset 0 1px 0 rgba(255,255,255,.8);
    }

    .toolBtn:active{
      transform:translateY(0) scale(.99);
    }

    .toolBtn span{
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .empty{
      padding:14px;
      border-radius:18px;
      text-align:center;
      font-weight:800;
      color:rgba(255,255,255,.84);
      background:rgba(255,255,255,.075);
      border:1px dashed rgba(255,255,255,.18);
    }

    footer{
      margin-top:16px;
      text-align:center;
      color:rgba(255,255,255,.68);
      font-size:12px;
      font-weight:700;
    }

    @media (max-width:760px){
      .hero{
        align-items:stretch;
        flex-direction:column;
      }

      h1{
        white-space:normal;
        text-align:center;
      }

      .search{
        width:100%;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .toolBtn{
        height:54px;
        font-size:14px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="hero">
        <h1>🧰 Panel de Herramientas</h1>

        <label class="search" title="Buscar herramienta">
          <span>🔎</span>
          <input id="q" type="search" placeholder="Buscar herramienta..." autocomplete="off">
        </label>
      </div>
    </div>

    <main id="app"></main>

    <footer>
      ✨ Creador: Brayan Raudales · <span id="year"></span>
    </footer>
  </div>

  <script>
    const SECTIONS = [
      {
        title: "🏢 Empresa",
        tools: [
          {
            name: "🛵 Costos de Envío Moto",
            href: "https://www.costoenvios.itemshn.com",
            keywords: "moto envios delivery tarifas colonia zona"
          },
          {
            name: "📍 Link CAEX / Cargo Expreso",
            href: "https://www.link.itemshn.com/",
            keywords: "caex cargo expreso guia rastreo tracking link"
          },
          {
            name: "🖼️ Fotos Marca Agua",
            href: "https://www.fotos.itemshn.com/",
            keywords: "fotos imagenes marca agua watermark"
          },
          {
            name: "🎥 Videos y Fotos Marca Agua",
            href: "https://www.videos.itemshn.com/",
            keywords: "videos fotos marca agua watermark"
          },
          {
            name: "📦 Calculadora de Cargas Peso/Volumen",
            href: "https://www.cajas.itemshn.com",
            keywords: "cajas cargas peso volumen volumetrico"
          },
          {
            name: "📍 Seguimiento de Trackings y Encargos",
            href: "https://www.trackings.itemshn.com/",
            keywords: "trackings tracking encargos paquetes seguimiento"
          },
          {
            name: "📦 Inventario OFICIAL",
            href: "https://www.merca.itemshn.com/",
            keywords: "inventario oficial merca stock productos gastos paquetes"
          }
        ]
      },
      {
        title: "🏍️ Vendedores y Moto",
        tools: [
          {
            name: "🧾 Deudas Entregador de Moto",
            href: "https://www.deudasmoto.itemshn.com/",
            keywords: "deudas entregador moto cobros"
          },
          {
            name: "📋 Deudas Entregador de Moto Pega",
            href: "https://catalogoshn.github.io/DEUDASMOTOPRO/",
            keywords: "deudas moto pega pro comisiones ventas"
          },
          {
            name: "📋 Calculadora Vendedores Comisiones",
            href: "https://www.vendedores.itemshn.com/",
            keywords: "vendedores comisiones calculadora ventas"
          },
          {
            name: "💰 Ganancias Vendedores Web",
            href: "https://www.gananciasvendedores.itemshn.com/",
            keywords: "ganancias vendedores web comisiones"
          }
        ]
      },
      {
        title: "👤 Personales",
        tools: [
          {
            name: "🥗 Rutina Alimenticia A",
            href: "https://www.rutinah.itemshn.com",
            keywords: "rutina alimenticia dieta comida"
          },
          {
            name: "🥑 Rutina Alimenticia Mayra",
            href: "https://www.rutinam.itemshn.com",
            keywords: "rutina alimenticia mayra dieta comida"
          },
          {
            name: "🦜 Rutina Pericos",
            href: "https://www.pericos.itemshn.com",
            keywords: "rutina pericos aves comida"
          }
        ]
      },
      {
        title: "👤 DEUDAS FAMILIA",
        tools: [
          {
            name: "👤 Rolando Deudas y Cuenta",
            href: "https://catalogoshn.github.io/deudrolan/",
            keywords: "Rolando Deudas y Cuenta"
          },
          {
            name: "👤 Moto Padre Deuda",
            href: "https://catalogoshn.github.io/ybr125/",
            keywords: "rutina alimenticia mayra dieta comida"
          },
          {
            name: "👤 Deudas 2 Personas Dolar y Lempiras",
            href: "https://catalogoshn.github.io/Deud2personas/",
            keywords: "Deudas 2 Personas Dolar y Lempiras"
          }
        ]
      }
    ];

    const app = document.getElementById("app");
    const input = document.getElementById("q");

    function safeHref(href){
      return href && href !== "LINK_AQUI" ? href : "#";
    }

    function makeButton(tool){
      const a = document.createElement("a");
      a.className = "toolBtn";
      a.href = safeHref(tool.href);
      a.target = a.href === "#" ? "_self" : "_blank";
      a.rel = "noopener noreferrer";
      a.dataset.search = `${tool.name} ${tool.keywords || ""}`.toLowerCase();

      const span = document.createElement("span");
      span.textContent = tool.name;

      a.appendChild(span);
      return a;
    }

    function render(filter = ""){
      app.innerHTML = "";
      const q = filter.trim().toLowerCase();
      let total = 0;

      SECTIONS.forEach(section => {
        const buttons = section.tools
          .map(makeButton)
          .filter(btn => !q || btn.dataset.search.includes(q));

        if(!buttons.length) return;

        total += buttons.length;

        const sectionEl = document.createElement("section");
        sectionEl.className = "section";

        const head = document.createElement("div");
        head.className = "sectionHead";

        const title = document.createElement("h2");
        title.className = "sectionTitle";
        title.textContent = section.title;

        const count = document.createElement("div");
        count.className = "count";
        count.textContent = buttons.length;

        const grid = document.createElement("div");
        grid.className = "grid";

        buttons.forEach(btn => grid.appendChild(btn));

        head.appendChild(title);
        head.appendChild(count);
        sectionEl.appendChild(head);
        sectionEl.appendChild(grid);
        app.appendChild(sectionEl);
      });

      if(!total){
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No encontré esa herramienta.";
        app.appendChild(empty);
      }
    }

    input.addEventListener("input", () => render(input.value));
    document.getElementById("year").textContent = `© ${new Date().getFullYear()}`;
    render();
  </script>
</body>
</html>
